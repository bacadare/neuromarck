  // ===== S4 colours =====
  scene(t, T.s4, T.s5, () => {

    });

  // ===== S5 symbols =====
  scene(t, T.s5, T.s6, () => {

    items.forEach((it, i) => { const t0 = it[3], t1 = it[4]; if (t < t0 - 0.14 || t >= t1 - 0.04) return; const out = eIn(seg(t, t1 - 0.2, t1 - 0.04)), al = (1 - out) * SA, dir = i % 2 ? 1 : -1;

  // overlays: flash, vignette, fade
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.shadowBlur = 0; ctx.filter = 'none';
  if (fl > 0.01) { ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = Math.min(fl, 1) * 0.5; ctx.fillStyle = '#ffdf9a'; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over'; }
  ctx.globalAlpha = 1; const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.72); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.7)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  const fade = seg(t, 0, 0.3) * (1 - seg(t, DUR - 0.35, DUR)); if (fade < 1) { ctx.globalAlpha = 1 - fade; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}
